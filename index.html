<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Coach">
<title>Mon Coach Fitness</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{
  --green:#22c55e;--green-dark:#16a34a;--green-bg:#dcfce7;--green-text:#15803d;
  --blue:#3b82f6;--blue-bg:#dbeafe;--blue-text:#1d4ed8;
  --amber-bg:#fef3c7;--amber-text:#92400e;
  --red:#ef4444;--red-bg:#fee2e2;--red-text:#991b1b;
  --purple-bg:#ede9fe;--purple-text:#5b21b6;
  --orange:#f97316;--orange-bg:#fff7ed;--orange-text:#c2410c;
  --teal-bg:#ccfbf1;--teal-text:#0f766e;
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--light:#f1f5f9;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text)}
.app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;flex-shrink:0}
.topbar-left .date{font-size:12px;color:var(--muted)}
.topbar-left .title{font-size:18px;font-weight:700}
.flame-pill{display:flex;align-items:center;gap:4px;background:#fff7ed;border:1px solid #fed7aa;border-radius:20px;padding:5px 12px;font-size:15px;font-weight:700;color:#c2410c;cursor:pointer}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px}
.bottom-nav{display:flex;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:8px;font-family:inherit;transition:color .15s}
.nav-btn.active{color:var(--green-dark)}
.nav-btn svg{width:19px;height:19px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.card-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.card-head-title{font-size:14px;font-weight:600}
.card-body{padding:12px 14px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.b-run{background:var(--green-bg);color:var(--green-text)}
.b-gym{background:var(--blue-bg);color:var(--blue-text)}
.b-rest{background:var(--light);color:var(--muted)}
/* GOAL CARD */
.goal-card{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:18px;padding:18px;margin-bottom:10px;color:#fff}
.goal-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.goal-kg{font-size:38px;font-weight:700;line-height:1}
.goal-kg span{font-size:16px;opacity:.6}
.goal-lbl{font-size:11px;opacity:.6;margin-top:2px}
.goal-right{text-align:right}
.goal-target{font-size:20px;font-weight:700;color:var(--green)}
.progress-bg{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .6s}
.eta-row{display:flex;justify-content:space-between;align-items:center}
.eta-main{font-size:12px;font-weight:600;color:var(--green)}
.eta-pct{font-size:11px;opacity:.5}
/* PHASE */
.phase-pill{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer}
.phase-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0}
.phase-name{font-size:13px;font-weight:600}
.phase-sub{font-size:11px;color:var(--muted);margin-top:1px}
.chevron{margin-left:auto;color:var(--muted);font-size:16px}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat-card{background:var(--light);border-radius:12px;padding:8px 6px;text-align:center}
.stat-val{font-size:16px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:9px;color:var(--muted);margin-top:2px}
/* GYM */
.gym-section{margin-bottom:12px}
.gym-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.gym-section-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.s-warmup{background:#fef3c7;color:#92400e}
.s-muscle{background:#dbeafe;color:#1d4ed8}
.s-cardio{background:#dcfce7;color:#15803d}
.exercise-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start;cursor:pointer}
.exercise-row:last-child{border-bottom:none}
.exercise-row:active{background:var(--light);margin:0 -14px;padding:9px 14px}
.ex-num{width:24px;height:24px;border-radius:50%;background:var(--blue-bg);color:var(--blue-text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.ex-name{font-size:13px;font-weight:600;color:var(--text)}
.ex-detail{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.ex-sets{font-size:11px;font-weight:600;background:var(--light);color:var(--muted);padding:2px 7px;border-radius:6px;margin-top:4px;display:inline-block}
.ex-footer{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.ex-log-btn{font-size:11px;padding:3px 10px;border-radius:8px;border:1.5px solid var(--blue-text);color:var(--blue-text);background:none;cursor:pointer;font-family:inherit;font-weight:600}
.ex-video-btn{font-size:11px;padding:3px 10px;border-radius:8px;border:1.5px solid var(--muted);color:var(--muted);background:none;cursor:pointer;font-family:inherit}
.ex-logval{font-size:11px;color:var(--green-text);font-weight:600}
.timer-btn{font-size:11px;padding:3px 10px;border-radius:8px;border:1.5px solid var(--orange-text);color:var(--orange-text);background:none;cursor:pointer;font-family:inherit;font-weight:600}
/* TAPIS */
.tapis-card{background:linear-gradient(135deg,#1e3a5f,#0f172a);border-radius:14px;padding:14px;margin-top:4px;color:#fff}
.tapis-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:10px}
.tapis-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tapis-stat{text-align:center}
.tapis-val{font-size:18px;font-weight:700}
.tapis-lbl{font-size:10px;opacity:.6;margin-top:2px}
.tapis-note{font-size:11px;opacity:.6;margin-top:10px;text-align:center}
/* PROG ITEMS (run/rest) */
.prog-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.prog-item:last-child{border-bottom:none}
.prog-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ico-run{background:var(--green-bg)}.ico-gym{background:var(--blue-bg)}.ico-rest{background:var(--light)}
.prog-lbl{font-size:13px;font-weight:500}
.prog-det{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
/* DONE BTN */
.done-btn{display:block;width:100%;padding:13px;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:all .15s;border-top:1px solid var(--border)}
.done-btn.go{background:var(--green);color:#fff}
.done-btn.go:active{background:var(--green-dark);transform:scale(.98)}
.done-btn.did{background:var(--light);color:var(--muted);cursor:default}
.tired-btn{display:block;width:100%;padding:10px;font-size:13px;font-weight:500;font-family:inherit;border:none;background:var(--amber-bg);color:var(--amber-text);cursor:pointer;border-top:1px solid var(--border)}
/* MEALS */
.meal-row{padding:9px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-row.creatine-row{background:var(--purple-bg);margin:0 -14px;padding:9px 14px}
.meal-row.done-meal{opacity:.5}
.meal-t{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between}
.meal-row.creatine-row .meal-t{color:var(--purple-text)}
.meal-n{font-size:13px;margin-top:2px;line-height:1.4}
.meal-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;flex-shrink:0;transition:all .15s}
.meal-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.macros{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.macro-pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--light);color:var(--muted)}
.macro-pill.prot{background:#dbeafe;color:#1d4ed8}
.macro-pill.gluc{background:#dcfce7;color:#15803d}
.macro-pill.lip{background:#fef3c7;color:#92400e}
/* PROTEIN BAR */
.prot-bar-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.prot-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prot-bar-title{font-size:13px;font-weight:600}
.prot-bar-val{font-size:13px;font-weight:700;color:var(--blue-text)}
.prot-bar-bg{height:8px;background:var(--light);border-radius:4px;overflow:hidden}
.prot-bar-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .4s}
/* HYDRATION */
.hydra-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.water-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--blue-bg);background:var(--card);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.water-btn.filled{background:var(--blue-bg);border-color:var(--blue)}
.hydra-label{font-size:12px;color:var(--muted);margin-left:4px}
/* SECTION TITLE */
.stitle{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px}
/* REMINDER */
.reminder{background:var(--amber-bg);border-radius:12px;padding:11px 13px;margin-bottom:10px;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--amber-text);font-weight:500}
/* WEEK */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.day-lbl{font-size:9px;color:var(--muted)}
.day-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid var(--border);background:var(--light);transition:transform .1s}
.day-dot:active{transform:scale(.9)}
.dd-run{background:var(--green-bg);border-color:var(--green)}
.dd-gym{background:var(--blue-bg);border-color:#93c5fd}
.dd-rest{background:var(--light)}
.dd-today{border:2.5px solid var(--green)}
.dd-future{opacity:.3}
.wplan-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.wplan-row:last-child{border-bottom:none}
.wplan-day{width:28px;font-size:11px;color:var(--muted)}
.wplan-arrow{margin-left:auto;color:var(--muted);font-size:14px}
/* WEIGHT */
.w-input-row{display:flex;gap:8px;margin-bottom:12px}
.w-input-row input{flex:1;padding:11px 13px;font-size:16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;-webkit-appearance:none}
.w-input-row input:focus{outline:none;border-color:var(--green)}
.w-input-row button{padding:11px 16px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.w-hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.w-hist-row:last-child{border-bottom:none}
.chart-wrap{width:100%;height:140px;position:relative;margin:4px 0 8px}
canvas{width:100%!important}
/* MEASUREMENTS */
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.meas-item{background:var(--light);border-radius:12px;padding:10px 12px}
.meas-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.meas-val{font-size:18px;font-weight:700}
.meas-diff{font-size:11px;margin-top:2px}
.meas-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.meas-input-wrap{display:flex;flex-direction:column;gap:4px}
.meas-input-wrap label{font-size:11px;color:var(--muted);font-weight:500}
.meas-input-wrap input{padding:9px 12px;font-size:14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit;-webkit-appearance:none;width:100%}
/* STRENGTH */
.strength-item{padding:9px 0;border-bottom:1px solid var(--border)}
.strength-item:last-child{border-bottom:none}
.strength-name{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.strength-val{font-size:16px;font-weight:700;color:var(--blue-text)}
.strength-hist{font-size:11px;color:var(--muted);margin-top:3px}
.strength-add{display:flex;gap:6px;margin-top:6px}
.strength-add input{flex:1;padding:7px 10px;font-size:13px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;-webkit-appearance:none}
.strength-add button{padding:7px 12px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.badge-item{background:var(--light);border-radius:14px;padding:12px 8px;text-align:center;border:1.5px solid var(--border)}
.badge-item.unlocked{background:var(--amber-bg);border-color:#fed7aa}
.badge-ico{font-size:28px;margin-bottom:6px}
.badge-name{font-size:11px;font-weight:600;color:var(--text);line-height:1.3}
.badge-desc{font-size:10px;color:var(--muted);margin-top:3px}
.badge-item.locked .badge-ico{filter:grayscale(1);opacity:.4}
.badge-item.locked .badge-name{color:var(--muted)}
/* PHASE BLOCKS */
.phase-block{border:1.5px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.phase-block.active-ph{border-color:var(--green);background:#f0fdf4}
.phase-block-head{display:flex;align-items:center;gap:10px}
.ph-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.ph-circle.act{border-color:var(--green);background:var(--green);color:#fff}
.ph-title{font-size:13px;font-weight:600;flex:1}
.ph-body{margin-top:10px;display:none;border-top:1px solid var(--border);padding-top:10px}
.ph-body.open{display:block}
.ph-item{display:flex;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}
.ph-item:last-child{border-bottom:none}
.ph-item-ico{width:22px;text-align:center;flex-shrink:0}
/* SHOP */
.shop-item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.shop-item-row:last-child{border-bottom:none}
.shop-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .15s}
.shop-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.shop-name{font-size:13px;flex:1}
.shop-qty{font-size:11px;color:var(--muted);white-space:nowrap}
/* FOOD PREFS */
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.food-chip{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:12px}
.food-chip.liked{border-color:var(--green);background:var(--green-bg);color:var(--green-text)}
.food-chip.disliked{border-color:var(--red);background:var(--red-bg);color:var(--red-text)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px;padding-bottom:calc(20px + var(--safe-bottom));width:100%;max-height:92vh;overflow-y:auto;transform:translateY(40px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title-row{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
/* TIMER */
.timer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.95);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.timer-overlay.open{opacity:1;pointer-events:all}
.timer-label{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:8px;text-align:center}
.timer-display{font-size:72px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.timer-exercise{font-size:16px;color:rgba(255,255,255,.8);margin-top:12px;text-align:center;font-weight:500}
.timer-btns{display:flex;gap:12px;margin-top:32px}
.timer-btn-main{padding:14px 32px;border-radius:50px;border:none;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.timer-btn-main.start{background:var(--green);color:#fff}
.timer-btn-main.pause{background:#f97316;color:#fff}
.timer-close-btn{padding:14px 24px;border-radius:50px;border:2px solid rgba(255,255,255,.3);background:none;color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.timer-progress{width:200px;height:200px;position:relative;margin-bottom:8px}
.timer-progress svg{transform:rotate(-90deg)}
.timer-progress .timer-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px}
/* TIP */
.tip-card{background:var(--purple-bg);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:12px;color:var(--purple-text);line-height:1.5}
.tip-card strong{font-weight:600}
/* QUICK MEAL */
.quick-meal{background:var(--teal-bg);border-radius:12px;padding:10px 13px;margin-bottom:6px;font-size:12px;color:var(--teal-text)}
.quick-meal strong{font-weight:600;display:block;margin-bottom:3px}
/* input styles */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="date" id="date-str"></div>
      <div class="title">Mon Coach 💪</div>
    </div>
    <div class="flame-pill" id="flame-pill" onclick="showBadges()">🔥 <span id="streak-num">0</span></div>
  </div>
  <div class="scroll-area">
    <div class="tab active" id="tab-today"></div>
    <div class="tab" id="tab-week"></div>
    <div class="tab" id="tab-prog"></div>
    <div class="tab" id="tab-body"></div>
    <div class="tab" id="tab-poids"></div>
    <div class="tab" id="tab-courses"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showTab('today',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Aujourd'hui
    </button>
    <button class="nav-btn" onclick="showTab('week',this)">

// ─── STATE ────────────────────────────────────────────────────
function getState(){
  try{return JSON.parse(localStorage.getItem('coach_v6')||'null')||defState()}
  catch(e){return defState()}
}
function defState(){
  return{
    streak:0,lastDone:null,weight:93,weights:[],doneDays:{},
    gymSessionA:0,gymSessionB:0,runIdx:0,
    startDate:new Date().toISOString(),
    foodPrefs:{},shopChecked:{},
    measurements:[],
    strengthLog:{},
    mealsDone:{},
    hydration:{},
    unlockedBadges:[],
    tiredMode:false
  };
}
function saveState(s){try{localStorage.setItem('coach_v6',JSON.stringify(s))}catch(e){}}
function todayKey(){const d=new Date();return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`}
function getWeekNum(s){return Math.min(Math.floor((new Date()-new Date(s.startDate))/(7*24*3600*1000)),15)}
function getPhase(w){return w<3?0:w<6?1:w<10?2:3}
function getWeekInPhase(w){if(w<3)return w;if(w<6)return w-3;if(w<10)return Math.min(w-6,2);return Math.min(w-10,2)}
function getGymSession(s,t){const wk=getWeekNum(s);const ph=getPhase(wk);const wip=getWeekInPhase(wk);const phD=GYM_SESSIONS[ph];const wkD=phD[Math.min(wip,phD.length-1)];return t==='A'?wkD[0]:wkD[1]}
function calcETA(state){
  const cur=state.weights.length>0?state.weights[0].val:state.weight;
  const tolose=cur-80;
  if(tolose<=0)return{weeks:0,dateStr:'Objectif atteint ! 🎉',rate:'0.40'};
  let rate=0.4;
  const wk=getWeekNum(state);
  if(wk>1&&state.weights.length>=2){const oldest=state.weights[state.weights.length-1].val;const newest=state.weights[0].val;const actual=(oldest-newest)/Math.max(1,wk);if(actual>0.1)rate=Math.min(actual,0.8);}
  const weeks=Math.ceil(tolose/rate);
  const arr=new Date();arr.setDate(arr.getDate()+weeks*7);
  return{weeks,dateStr:MONTHS[arr.getMonth()]+' '+arr.getFullYear(),rate:rate.toFixed(2)};
}

  const s=getState();

  BADGE_DEFS.forEach(b=>{

      s.unlockedBadges.push(b.id);
      newBadges.push(b);
    }
  });
  if(newBadges.length){saveState(s);newBadges.forEach(b=>showBadgeNotif(b));}
}
function showBadgeNotif(b){

}
function showBadges(){
  const s=getState();
  const html=`<div class="badges-grid">${BADGE_DEFS.map(b=>{const unlocked=s.unlockedBadges.includes(b.id);return`<div class="badge-item ${unlocked?'unlocked':'locked'}"><div class="badge-ico">${b.ico}</div><div class="badge-name">${b.name}</div><div class="badge-desc">${b.desc}</div></div>`}).join('')}</div>`;

}

// ─── RENDER MEALS ─────────────────────────────────────────────
function renderMeals(meals, showCheck){
  const s=getState();
  const key=todayKey();
  const mealsDone=s.mealsDone||{};
  const dayDone=mealsDone[key]||{};
  let totalProt=0;
  const html=meals.map((m,i)=>{
    const isCreatine=m.t.includes('Créatine');
    const isDone=!!dayDone[i];
    if(isDone&&!isCreatine){
      const match=m.k.match(/(\d+)g P/);
      if(match)totalProt+=parseInt(match[1]);
    }
    const kparts=m.k.split('·');
    const kcal=kparts[0]?kparts[0].trim():'';
    const prot=kparts[1]?kparts[1].trim():'';
    const gluc=kparts[2]?kparts[2].trim():'';
    const lip=kparts[3]?kparts[3].trim():'';
    const macrosHTML=!isCreatine&&prot?`<div class="macros"><span class="macro-pill">${kcal}</span><span class="macro-pill prot">💪 ${prot}</span>${gluc?`<span class="macro-pill gluc">🌾 ${gluc}</span>`:''}${lip?`<span class="macro-pill lip">🥑 ${lip}</span>`:''}</div>`:`<div style="font-size:11px;color:var(--muted);margin-top:3px">${m.k}</div>`;
    const checkHTML=showCheck&&!isCreatine?`<div class="meal-check ${isDone?'checked':''}" onclick="toggleMeal(${i})">${isDone?'✓':''}</div>`:'';
    return`<div class="meal-row${isCreatine?' creatine-row':''}${isDone?' done-meal':''}">
      <div class="meal-t">${m.t}${checkHTML}</div>
      <div class="meal-n">${m.n}</div>
      ${macrosHTML}
    </div>`;
  }).join('');
  return{html,totalProt};
}

function toggleMeal(idx){
  const s=getState();
  const key=todayKey();
  if(!s.mealsDone)s.mealsDone={};
  if(!s.mealsDone[key])s.mealsDone[key]={};
  s.mealsDone[key][idx]=!s.mealsDone[key][idx];
  saveState(s);
  renderToday();
}

// ─── TAB: TODAY ───────────────────────────────────────────────
function renderToday(){
  const s=getState();
  const dow=new Date().getDay();
  const sched=SCHED[dow];
  const isDone=!!s.doneDays[todayKey()];
  const wk=getWeekNum(s);
  const ph=getPhase(wk);
  const eta=calcETA(s);
  const cur=s.weights.length>0?s.weights[0].val:s.weight;
  const pct=Math.max(0,Math.min(100,Math.round((93-cur)/(93-80)*100)));
  const isGymA=dow===2;
  const isTired=!!s.tiredMode;

  // Protein bar
  const meals=getWeeklyMeals(wk,sched.type);
  const key=todayKey();
  const mealsDone=s.mealsDone||{};
  const dayDone=mealsDone[key]||{};
  let totalProt=0;
  meals.forEach((m,i)=>{if(dayDone[i]&&!m.t.includes('Créatine')){const match=m.k.match(/(\d+)g P/);if(match)totalProt+=parseInt(match[1]);}});
  const protTarget=185;
  const protPct=Math.min(100,Math.round(totalProt/protTarget*100));

  // Hydration
  const hydration=s.hydration||{};
  const todayHydra=hydration[key]||0;
  const waterTarget=sched.type!=='rest'?10:8;
  const waterHTML=Array.from({length:waterTarget},(_,i)=>`<div class="water-btn${i<todayHydra?' filled':''}" onclick="addWater(${i})">${i<todayHydra?'💧':'○'}</div>`).join('');

  // Session content

function toggleTired(){
  const s=getState();s.tiredMode=!s.tiredMode;saveState(s);renderToday();
}
function addWater(idx){
  const s=getState();const key=todayKey();
  if(!s.hydration)s.hydration={};
  const cur=s.hydration[key]||0;
  s.hydration[key]=idx<cur?idx:idx+1;
  saveState(s);renderToday();
}

function markDone(){
  const s=getState();const key=todayKey();
  if(s.doneDays[key])return;
  s.doneDays[key]=true;
  const dow=new Date().getDay();
  if(SCHED[dow].type==='run')s.runIdx=(s.runIdx||0)+1;
  else if(SCHED[dow].type==='gym'){if(dow===2)s.gymSessionA=(s.gymSessionA||0)+1;else s.gymSessionB=(s.gymSessionB||0)+1;}
  const yest=new Date();yest.setDate(yest.getDate()-1);
  const yKey=`${yest.getFullYear()}-${yest.getMonth()}-${yest.getDate()}`;
  if(s.lastDone===yKey||s.lastDone===null)s.streak++;else if(s.lastDone!==key)s.streak=1;
  s.lastDone=key;s.tiredMode=false;
  saveState(s);renderHeader();checkBadges();renderToday();
}

function logStrength(exName,logKey){
  openModal('Logger les charges 📝',`
    <div style="font-size:14px;font-weight:600;margin-bottom:12px">${exName}</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Entre le poids utilisé (en kg) pour cette séance</div>

      <input type="number" id="kg-input" placeholder="ex: 40" step="2.5" min="0" max="300" inputmode="decimal" style="flex:1;padding:12px;font-size:16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:inherit">
      <button onclick="saveStrength('${exName.replace(/'/g,"\\'")}','${logKey}')" style="padding:12px 18px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">Sauver</button>

function saveStrength(exName,logKey){
  const inp=document.getElementById('kg-input');
  const val=parseFloat(inp.value);
  if(isNaN(val)||val<0)return;
  const s=getState();
  if(!s.strengthLog)s.strengthLog={};
  s.strengthLog[logKey]=val;
  if(!s.strengthHistory)s.strengthHistory={};
  if(!s.strengthHistory[exName])s.strengthHistory[exName]=[];
  s.strengthHistory[exName].unshift({val,date:new Date().toLocaleDateString('fr-FR')});
  if(s.strengthHistory[exName].length>10)s.strengthHistory[exName]=s.strengthHistory[exName].slice(0,10);
  saveState(s);closeModal();renderToday();
}

function renderStrengthHistory(exName){
  const s=getState();
  const hist=(s.strengthHistory||{})[exName]||[];
  const el=document.getElementById('strength-history-modal');
  if(!el||!hist.length)return;
  el.innerHTML=`<div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Historique</div>`+hist.map((h,i)=>{
    const prev=hist[i+1];
    const diff=prev?(h.val-prev.val).toFixed(1):null;
    const arrow=diff?(parseFloat(diff)>0?`<span style="color:var(--green)">+${diff}kg ↑</span>`:(parseFloat(diff)<0?`<span style="color:var(--red)">${diff}kg ↓</span>`:'')):'' ;
    return`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--muted)">${h.date}</span><span style="font-weight:600">${h.val} kg ${arrow}</span></div>`;
  }).join('');
}

function renderWeek(){
  const s=getState();const today=new Date();
  const mon=new Date(today);mon.setDate(today.getDate()-((today.getDay()+6)%7));
  const wk=getWeekNum(s);
  let dots='',plan='';
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const dow=d.getDay();const sc=SCHED[dow];
    const isToday=d.toDateString()===today.toDateString();
    const isFuture=d>today;const isDone=!!s.doneDays[key];
    let cls='day-dot';let icon='';
    if(!isFuture){if(isDone){cls+=` dd-${sc.type}`;icon=sc.type==='run'?'🏃':sc.type==='gym'?'💪':'😌';}else{cls+=' dd-rest';icon=isToday?'·':'✗';}}
    else{cls+=' dd-future';icon=sc.type==='run'?'🏃':sc.type==='gym'?'💪':'😌';}
    if(isToday)cls+=' dd-today';
    dots+=`<div class="day-cell" onclick="openDayModal(${dow})"><div class="day-lbl">${DAYS_S[dow]}</div><div class="${cls}">${icon}</div></div>`;
  }
  const wlbls=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];const wdows=[1,2,3,4,5,6,0];
  plan=wlbls.map((lbl,i)=>{const dow=wdows[i];const sc=SCHED[dow];const isGA=dow===2;
    return`<div class="wplan-row" onclick="openDayModal(${dow})"><span class="wplan-day">${lbl}</span><span class="badge b-${sc.type}">${sc.type==='run'?'Course':sc.type==='gym'?'Salle':'Repos'}</span><span style="font-size:12px;flex:1;margin-left:6px">${sc.type==='gym'?(isGA?'Séance A — Bas/Haut':'Séance B — Haut/Bas'):sc.label}</span><span class="wplan-arrow">›</span></div>`;
  }).join('');
  document.getElementById('tab-week').innerHTML=`
    <div class="stitle">Cette semaine · Semaine ${wk+1}</div>
    <div class="card"><div class="card-body"><div class="week-grid">${dots}</div><div style="font-size:11px;color:var(--muted);text-align:center">Appuie sur un jour pour le programme</div></div></div>

function renderBody(){
  const s=getState();

  }).join(''):`<div style="font-size:13px;color:var(--muted);padding:8px 0">Aucune mesure enregistrée</div>`;

  document.getElementById('tab-body').innerHTML=`

  `;

function saveMeasurements(){
  const s=getState();
  const fields=['waist','hips','thigh','arm','chest'];
  const entry={date:new Date().toLocaleDateString('fr-FR')};
  let hasVal=false;
  fields.forEach(k=>{const el=document.getElementById('meas-'+k);if(el&&el.value){entry[k]=parseFloat(el.value);hasVal=true;}});

  if(!s.measurements)s.measurements=[];
  s.measurements.unshift(entry);
  if(s.measurements.length>20)s.measurements=s.measurements.slice(0,20);
  saveState(s);renderBody();
}

  grid.innerHTML=ALL_FOODS.map(f=>{const st=prefs[f.id];const cls=st===true?'liked':st===false?'disliked':'';return`<div class="food-chip ${cls}" onclick="toggleFood('${f.id}')"><span style="font-size:16px">${f.ico}</span><span style="flex:1">${f.name}</span><span>${st===true?'✅':st===false?'❌':''}</span></div>`;}).join('');
}
function toggleFood(id){const s=getState();if(!s.foodPrefs)s.foodPrefs={};const cur=s.foodPrefs[id];if(cur===undefined)s.foodPrefs[id]=true;else if(cur===true)s.foodPrefs[id]=false;else delete s.foodPrefs[id];saveState(s);renderFoodGrid();if(document.getElementById('tab-today').classList.contains('active'))renderToday();}
function doSaveWeight(){const s=getState();const inp=document.getElementById('w-in');const val=parseFloat(inp.value);if(isNaN(val)||val<40||val>200)return;s.weight=val;s.weights.unshift({val,date:new Date().toLocaleDateString('fr-FR')});if(s.weights.length>30)s.weights=s.weights.slice(0,30);inp.value='';saveState(s);renderPoids();renderHeader();checkBadges();if(document.getElementById('tab-today').classList.contains('active'))renderToday();}

function drawChart(){
  const s=getState();const canvas=document.getElementById('wchart');if(!canvas)return;
  const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;
  const w=canvas.offsetWidth||300;const h=140;
  canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);
  if(s.weights.length<2){ctx.fillStyle='#94a3b8';ctx.font='13px DM Sans,sans-serif';ctx.textAlign='center';ctx.fillText('Ajoute 2 pesées pour voir la courbe',w/2,h/2);return;}
  const pts=s.weights.slice().reverse();const vals=pts.map(p=>p.val);
  const mn=Math.min(...vals,80)-1;const mx=Math.max(...vals,93)+1;
  const pad={t:16,r:8,b:28,l:36};const cw=w-pad.l-pad.r;const ch=h-pad.t-pad.b;
  const xp=i=>pad.l+i*(cw/Math.max(pts.length-1,1));const yp=v=>pad.t+ch-(v-mn)/(mx-mn)*ch;
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  [80,85,90].forEach(v=>{if(v>=mn&&v<=mx){ctx.beginPath();ctx.moveTo(pad.l,yp(v));ctx.lineTo(pad.l+cw,yp(v));ctx.stroke();ctx.fillStyle='#94a3b8';ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v,pad.l-4,yp(v)+3);}});
  ctx.strokeStyle='#22c55e';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(pad.l,yp(80));ctx.lineTo(pad.l+cw,yp(80));ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(xp(i),yp(p.val)):ctx.lineTo(xp(i),yp(p.val))});ctx.stroke();
  ctx.fillStyle='rgba(59,130,246,.08)';ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(xp(i),yp(p.val)):ctx.lineTo(xp(i),yp(p.val))});ctx.lineTo(xp(pts.length-1),h-pad.b);ctx.lineTo(xp(0),h-pad.b);ctx.closePath();ctx.fill();
  pts.forEach((p,i)=>{ctx.fillStyle='#fff';ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(xp(i),yp(p.val),4,0,Math.PI*2);ctx.fill();ctx.stroke();});
  ctx.fillStyle='#94a3b8';ctx.font='9px DM Sans,sans-serif';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(pts.length/4));pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)ctx.fillText(p.date.slice(0,5),xp(i),h-8)});
  ctx.fillStyle='#22c55e';ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText('objectif 80 kg',w-6,yp(80)-4);
}

function renderCourses(){
  const s=getState();const wk=getWeekNum(s);const groups=getWeekShopList(wk);const checked=s.shopChecked||{};
  const total=Object.values(groups).reduce((a,g)=>a+g.length,0);
  const done=Object.keys(checked).filter(k=>checked[k]).length;
  let html=`<div class="tip-card">📅 <strong>Semaine ${wk+1}</strong> · Liste générée automatiquement selon tes préférences. Change chaque semaine !</div>
    <div class="stats-row"><div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Articles</div></div><div class="stat-card"><div class="stat-val" style="color:var(--green)">${done}</div><div class="stat-lbl">Cochés</div></div><div class="stat-card"><div class="stat-val">${total-done}</div><div class="stat-lbl">Restants</div></div><div class="stat-card"><div class="stat-val">${Math.round(done/total*100)||0}%</div><div class="stat-lbl">Fait</div></div></div>
    <button onclick="resetShop()" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);font-size:13px;font-family:inherit;color:var(--muted);margin-bottom:10px;cursor:pointer">🔄 Tout décocher</button>`;
  Object.entries(groups).forEach(([cat,items])=>{
    html+=`<div style="margin-bottom:12px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">${cat}</div><div class="card"><div class="card-body">`;
    items.forEach(it=>{const k=it.name;const isC=!!checked[k];html+=`<div class="shop-item-row"><div class="shop-check ${isC?'checked':''}" onclick="toggleShop('${k.replace(/'/g,"\\'")}')">${isC?'✓':''}</div><div class="shop-name" style="${isC?'text-decoration:line-through;color:var(--muted)':''}">${it.name}</div><div class="shop-qty">${it.qty}</div></div>`;});
    html+=`</div></div></div>`;
  });
  document.getElementById('tab-courses').innerHTML=html;
}
function toggleShop(n){const s=getState();if(!s.shopChecked)s.shopChecked={};s.shopChecked[n]=!s.shopChecked[n];saveState(s);renderCourses();}
function resetShop(){const s=getState();s.shopChecked={};saveState(s);renderCourses();}

// ─── TIMER ────────────────────────────────────────────────────
let timerInterval=null,timerRemaining=0,timerTotal=0,timerRunning=false;
function openTimer(secs,exerciseName){
  timerRemaining=secs;timerTotal=secs;timerRunning=false;
  document.getElementById('timer-display').textContent=formatTime(secs);
  document.getElementById('timer-label').textContent='Temps de repos';
  document.getElementById('timer-exercise').textContent='Prochain : '+exerciseName;
  document.getElementById('timer-start-btn').textContent='▶ Démarrer';
  document.getElementById('timer-start-btn').className='timer-btn-main start';
  updateTimerArc(1);
  document.getElementById('timer-overlay').classList.add('open');
}
function closeTimer(){clearInterval(timerInterval);timerRunning=false;document.getElementById('timer-overlay').classList.remove('open');}
function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('timer-start-btn').textContent='▶ Reprendre';document.getElementById('timer-start-btn').className='timer-btn-main start';}
  else{timerRunning=true;document.getElementById('timer-start-btn').textContent='⏸ Pause';document.getElementById('timer-start-btn').className='timer-btn-main pause';
    timerInterval=setInterval(()=>{timerRemaining--;document.getElementById('timer-display').textContent=formatTime(timerRemaining);updateTimerArc(timerRemaining/timerTotal);
      if(timerRemaining<=0){clearInterval(timerInterval);timerRunning=false;document.getElementById('timer-display').textContent='GO !';document.getElementById('timer-label').textContent='C\'est parti ! 💪';document.getElementById('timer-start-btn').textContent='▶ Relancer';document.getElementById('timer-start-btn').className='timer-btn-main start';timerRemaining=timerTotal;updateTimerArc(1);try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFhYqFhYqFiY').play().catch(()=>{})}catch(e){}}
    },1000);}
}
function formatTime(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function updateTimerArc(pct){const arc=document.getElementById('timer-arc');if(arc){const c=2*Math.PI*88;arc.style.strokeDashoffset=c*(1-pct);}}

// ─── MODAL ────────────────────────────────────────────────────
function openModal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function closeModalOutside(e){if(e.target===document.getElementById('modal'))closeModal()}
function openLink(url){window.open(url,'_blank')}

// ─── SHOW TAB ─────────────────────────────────────────────────
function showTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  document.querySelector('.scroll-area').scrollTop=0;
  const r={today:renderToday,week:renderWeek,prog:renderProg,body:renderBody,poids:renderPoids,courses:renderCourses};
  if(r[name])r[name]();
}
